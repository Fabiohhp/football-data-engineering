services:
  postgres:
    image: postgres:16
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: football-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standalone Spark cluster for the Silver/Gold transforms. Started via
  # `spark-class` rather than sbin/start-*.sh: the pip-installed PySpark
  # distribution has no launcher scripts, and a foreground JVM is what we want
  # under Compose anyway (signals reach the process, restarts work).
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: football-spark:latest
    container_name: football-spark-master
    restart: unless-stopped
    command: >
      spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./src:/opt/football/src:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: football-spark:latest
    container_name: football-spark-worker
    restart: unless-stopped
    command: >
      spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # Small dataset, single worker: keep the footprint modest so the whole
      # stack still runs on a laptop alongside Airflow and Postgres.
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8081:8081"
    volumes:
      - ./src:/opt/football/src:ro
    depends_on:
      spark-master:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
